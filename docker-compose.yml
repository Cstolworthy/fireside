services:
  fireside:
    image: ghcr.io/cstolworthy/fireside:latest
    build: .
    ports:
      - "8788:8788"
    environment:
      - FIRESIDE_DATA=/data
      # point at a MySQL/MariaDB server instead of the default SQLite file
      # - FIRESIDE_DB=mysql://fireside:secret@db:3306/fireside
    volumes:
      - ./data:/data   # library DB + content-addressed audio blobs
    restart: unless-stopped
