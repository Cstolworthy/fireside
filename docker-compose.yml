services:
  fireside:
    # published from CI on every main push; GHCR mirror stays private, so Hub is the public one
    image: docker.io/cstolworthy/fireside:latest
    build: .
    ports:
      - "8788:8788"
    environment:
      - FIRESIDE_DATA=/data
      # point at a MySQL/MariaDB server instead of the default SQLite file
      # - FIRESIDE_DB_TYPE=mysql
      # - FIRESIDE_DB_CONN=fireside:secret@db:3306/fireside
    volumes:
      - ./data:/data   # library DB + content-addressed audio blobs
    restart: unless-stopped
